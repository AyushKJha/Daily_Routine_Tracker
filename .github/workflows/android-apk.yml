name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare offline app assets
        run: python3 android/prepare_assets.py
      - name: Build and check Android source
        working-directory: android
        run: bash gradlew --no-daemon :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:lintRelease
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Verify offline journal and native exports on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: cd android && bash gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Upload unsigned release for private local signing
        uses: actions/upload-artifact@v4
        with:
          name: daily-android-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Upload test and lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
